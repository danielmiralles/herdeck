# Fragmento para ~/.config/herdr/config.toml (en el Mac y en el servidor del trabajo).
# Aplica con: herdr server reload-config

# Notificaciones cuando un agente termina o necesita input.
# "system" = notificación de macOS (usa terminal-notifier si está: brew install terminal-notifier).
# En el servidor remoto usa "terminal": la notificación viaja por SSH a tu terminal local.
[ui.toast]
delivery = "system"
delay_seconds = 1

# Sidebar: muestra la máquina (personal/trabajo), workspace, pestaña y el resumen
# que publiquen los plugins/integraciones ($summary).
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "$summary"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]
